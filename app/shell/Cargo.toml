[package]
name = "services-shell"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
services-contracts = { path = "../../api/protocol" }
services-kernel = { path = "../kernel" }
services-sdk = { path = "../../api/sdk" }
services-widgets = { path = "../widgets" }
# Built in on every target: Settings is part of the App.
services-module-settings = { path = "../../modules/panels/settings" }
serde_json.workspace = true
url = "2"
uuid = { version = "1.29.0", features = ["v7", "js"] }

# Service and panel modules load from their wasm in the browser; native builds (tests) link them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
services-module-rest = { path = "../../modules/services/rest" }
services-module-graphql = { path = "../../modules/services/graphql" }
services-module-opensearch = { path = "../../modules/services/opensearch" }
services-module-mysql = { path = "../../modules/services/mysql" }
services-module-grpc = { path = "../../modules/services/grpc" }
services-module-splunk = { path = "../../modules/services/splunk" }
services-module-terminal = { path = "../../modules/services/terminal" }
services-module-artemis = { path = "../../modules/services/artemis" }
services-module-variables = { path = "../../modules/panels/variables" }
services-module-history = { path = "../../modules/panels/history" }
services-module-templates = { path = "../../modules/panels/templates" }
services-module-hints = { path = "../../modules/panels/hints" }
services-module-dictionary = { path = "../../modules/panels/dictionary" }
services-module-sessions = { path = "../../modules/panels/sessions" }
services-module-diff = { path = "../../modules/panels/diff" }
services-module-agent = { path = "../../modules/panels/agent" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement",
  "HtmlTextAreaElement", "HtmlSelectElement", "Node", "Storage", "Event",
  "InputEvent", "KeyboardEvent", "MouseEvent", "PointerEvent", "DragEvent", "DataTransfer", "CssStyleDeclaration",
  "console", "DomRect", "Navigator",
  "Clipboard", "FocusEvent", "ResizeObserver", "StorageEvent",
  "ClipboardEvent", "DomTokenList"
] }
