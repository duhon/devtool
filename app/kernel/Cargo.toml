[package]
name = "services-kernel"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "App Kernel: loads wasm modules, runs their commands, no UI"

[dependencies]
services-sdk = { path = "../../api/sdk" }
prost = "0.13"
serde.workspace = true
serde_json.workspace = true
services-contracts = { path = "../../api/protocol" }
uuid = { version = "1.29.0", features = ["v7", "js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
base64 = "0.22"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
  "Window", "Document", "BeforeUnloadEvent", "Event", "EventTarget", "Element", "Storage", "Navigator", "console",
  "IdbFactory", "IdbOpenDbRequest", "IdbDatabase", "IdbObjectStore",
  "IdbRequest", "IdbTransaction", "IdbTransactionMode", "DomException"
] }
