[package]
name = "services-widgets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
services-sdk = { path = "../../api/sdk" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
url = "2"
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement",
  "HtmlTextAreaElement", "HtmlSelectElement", "Node", "Storage", "Event",
  "InputEvent", "KeyboardEvent", "MouseEvent", "PointerEvent", "DragEvent", "DataTransfer", "CssStyleDeclaration",
  "console", "DomRect", "Navigator",
  "Clipboard", "FocusEvent", "ResizeObserver", "BeforeUnloadEvent", "StorageEvent",
  "DomException", "ClipboardEvent", "DomTokenList"
] }
