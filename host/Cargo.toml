[package]
name = "services-native"
version.workspace = true
edition = "2024"

[lib]
name = "services_native"
path = "src/lib.rs"

[[bin]]
name = "services-devtools"
path = "src/main.rs"

[dependencies]
services-contracts = { path = "../api/protocol", features = ["archive"] }
services-sdk = { path = "../api/sdk" }
tempfile = "3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar.workspace = true
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
regex = "1"
bytes = "1"
libc = "0.2"
github-copilot-sdk = { version = "=1.0.26", default-features = false, features = ["runtime"] }
async-trait = "0.1"
rusqlite = { version = "0.38", features = ["bundled"] }
base64 = "0.22"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
mysql_async = { version = "0.34", default-features = false, features = ["minimal-rust", "rustls-tls"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
axum = { version = "0.8", features = ["http2"] }
http-body = "1"
http-body-util = "0.1"
url = "2"
prost = "0.13"
services-testkit = { path = "../tools/testkit" }
