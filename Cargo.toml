[workspace]
members = ["rust/contracts", "rust/native", "rust/ui", "rust/installer", "rust/xtask"]
resolver = "3"

[workspace.package]
version = "2.5.22"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
services-contracts = { path = "rust/contracts" }
