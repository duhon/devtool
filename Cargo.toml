[workspace]
members = ["api/protocol", "api/module-api", "api/module-ui", "modules/services/rest", "modules/services/rest/ui", "modules/services/graphql", "modules/services/graphql/ui", "modules/services/grpc", "modules/services/grpc/ui", "modules/services/mysql", "modules/services/mysql/ui", "modules/services/splunk", "modules/services/splunk/ui", "modules/services/terminal", "modules/services/terminal/ui", "modules/services/artemis", "modules/services/artemis/ui", "modules/services/opensearch", "modules/services/opensearch/ui", "examples/echo", "examples/echo/ui", "host", "app/ui", "installer", "tools/testkit", "tools/xtask"]
resolver = "3"

[workspace.package]
version = "3.7.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
services-contracts = { path = "api/protocol" }
