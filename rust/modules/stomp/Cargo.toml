[package]
name = "services-module-stomp"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "STOMP service module (Apache ActiveMQ Artemis and other brokers)"

[dependencies]
stabby = "72.1"
services-module-api = { path = "../../module-api" }
services-contracts.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
tokio-util = "0.7"
url = "2"
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"

[lib]
crate-type = ["rlib", "cdylib"]
