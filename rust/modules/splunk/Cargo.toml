[package]
name = "services-module-splunk"
version = "3.2.0"
edition.workspace = true
publish.workspace = true
description = "Splunk service module"

[dependencies]
stabby = "72.1"
services-module-api = { path = "../../module-api" }
services-contracts.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
url = "2"
httpdate = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lib]
crate-type = ["rlib", "cdylib"]

[package.metadata.services]
# The oldest Services DevTools version this module works with.
min-core = "3.2.0"
