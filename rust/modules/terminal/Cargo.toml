[package]
name = "services-module-terminal"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Terminal service module"

[dependencies]
stabby = "72.1"
services-module-api = { path = "../../module-api" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "macros", "sync"] }
tokio-util = "0.7"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lib]
crate-type = ["rlib", "cdylib"]
