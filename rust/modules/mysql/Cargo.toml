[package]
name = "services-module-mysql"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "MySQL service module"

[dependencies]
stabby = "72.1"
services-module-api = { path = "../../module-api" }
services-contracts.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"
url = "2"
mysql_async = { version = "0.34", default-features = false, features = ["minimal-rust", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
chrono-tz = "0.10"

[lib]
crate-type = ["rlib", "cdylib"]
