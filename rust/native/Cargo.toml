[package]
name = "services-native"
version.workspace = true
edition = "2024"

[lib]
name = "services_native"
path = "src/lib.rs"

[[bin]]
name = "services-devtools"
path = "src/main.rs"

[dependencies]
services-contracts = { path = "../contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
regex = "1"
axum = { version = "0.8", features = ["ws", "http2"] }
tower-http = { version = "0.6", features = ["fs"] }
mysql_async = { version = "0.34", default-features = false, features = ["minimal-rust", "rustls-tls"] }
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
protox = "0.7"
bytes = "1"
http = "1"
base64 = "0.22"
libc = "0.2"
httpdate = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
github-copilot-sdk = { version = "=1.0.26", default-features = false, features = ["runtime"] }
async-trait = "0.1"
rusqlite = { version = "0.38", features = ["bundled"] }

[dev-dependencies]
chrono-tz = "0.10"
