[package]
name = "services-contracts"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
yaml-rust2 = { version = "0.13", default-features = false, optional = true }

[features]
# Package files (`package::archive`, `package::skill_frontmatter`): the host, the test kit
# and xtask; not the browser.
archive = ["dep:flate2", "dep:tar", "dep:yaml-rust2"]
