[package]
name = "services-module-grpc"
version = "4.0.0"
edition.workspace = true
publish.workspace = true
description = "gRPC service module"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
services-sdk = { path = "../../../api/sdk" }
serde_json.workspace = true
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
protox = { version = "0.7", default-features = false }
