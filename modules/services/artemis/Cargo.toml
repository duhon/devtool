[package]
name = "services-module-artemis"
version = "6.0.0"
edition.workspace = true
publish.workspace = true
description = "Apache ActiveMQ Artemis service module (queues over the broker's Jolokia management API)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
services-sdk = { path = "../../../api/sdk" }
serde_json.workspace = true
url = "2"
percent-encoding = "2"
base64 = "0.22"

[dev-dependencies]
prost = "0.13"
