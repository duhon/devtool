[package]
name = "services-module-kubernetes"
version = "1.0.0"
edition.workspace = true
publish.workspace = true
description = "Kubernetes service module (kubectl-style verbs over the Host kubernetes driver)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
services-sdk = { path = "../../../api/sdk" }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10.0"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }

[dev-dependencies]
prost = "0.13"
services-native = { path = "../../../host" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

[package.metadata.services]
min-core = "4.1.0"
