[package]
name = "services-module-opensearch"
version = "1.0.0"
edition.workspace = true
publish.workspace = true
description = "OpenSearch service module (the cluster's HTTP API, discovery from index mappings)"

[dependencies]
stabby = "72.1"
services-module-api = { path = "../../../api/module-api" }
serde_json.workspace = true
url = "2"

[lib]
crate-type = ["rlib", "cdylib"]

[package.metadata.services]
# The oldest Services DevTools version this module works with.
min-core = "3.3.0"
