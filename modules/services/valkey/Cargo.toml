[package]
name = "services-module-valkey"
version = "1.0.0"
edition.workspace = true
publish.workspace = true
description = "Valkey service module (commands and Pub/Sub over TCP sessions)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
services-sdk = { path = "../../../api/sdk" }
serde.workspace = true
serde_json.workspace = true
shlex = "1.3"
url = "2"
percent-encoding = "2"

[dev-dependencies]
prost = "0.13"
wasmi = "0.46"
services-native = { path = "../../../host" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
redis = { version = "0.32", default-features = false, features = ["tokio-comp"] }

[package.metadata.services]
min-core = "4.1.0"
