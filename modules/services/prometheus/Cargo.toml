[package]
name = "services-module-prometheus"
version = "0.3.0"
edition.workspace = true
publish.workspace = true
description = "Prometheus PromQL service module (instant and range queries, charts, discovery over the Host http driver)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
services-sdk = { path = "../../../api/sdk" }
serde.workspace = true
serde_json.workspace = true
url = "2"
promql-parser = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["std"] }

[dev-dependencies]
prost = "0.13"

[package.metadata.services]
min-core = "5.1.0"
