[package]
name = "services-module-terminal"
version = "3.2.2"
edition.workspace = true
publish.workspace = true
description = "Terminal service module"

[dependencies]
stabby = "72.1"
services-module-api = { path = "../../../api/module-api" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "macros", "sync"] }
tokio-util = "0.7"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lib]
crate-type = ["rlib", "cdylib"]

[package.metadata.services]
# The oldest Services DevTools version this module works with.
min-core = "3.2.0"
