// Host functions a module may call (`Host/<rpc>` over the module transport).
// Stable from 3.0.0: new rpcs and fields are minor changes, nothing is renumbered or removed.
syntax = "proto3";

package services.host.v3;

service Host {
  rpc Http(HttpRequest) returns (HttpResponse);
  // First message carries `head`, every following one a body `chunk`. Closing the receiving side
  // stops reading and closes the connection.
  rpc HttpStream(HttpRequest) returns (stream HttpStreamMessage);
  rpc Context(Empty) returns (Context);
  rpc Log(LogRequest) returns (Empty);
}

message Empty {}

message Header {
  string name = 1;
  string value = 2;
}

message HttpRequest {
  string method = 1;
  string url = 2;
  repeated Header headers = 3;
  optional bytes body = 4;
  // Decode the body as UTF-8, replacing invalid sequences; `HttpResponse.body` is then
  // guaranteed to be valid UTF-8.
  bool text = 5;
  // 0 means no timeout.
  uint64 timeout_ms = 6;
  // 4xx and 5xx responses fail with `HttpFailure.status`.
  bool error_for_status = 7;
  bool no_redirects = 8;
  bool no_retries = 9;
}

message HttpResponse {
  uint32 status = 1;
  string status_text = 2;
  string http_version = 3;
  repeated Header headers = 4;
  bytes body = 5;
  // Time from the start of the host call to the response headers.
  uint64 headers_us = 6;
  optional string remote_address = 7;
  uint32 remote_port = 8;
  string remote_family = 9;
}

message HttpStreamMessage {
  oneof kind {
    HttpResponse head = 1;
    bytes chunk = 2;
  }
}

// `Status.details` of a failed `Http` / `HttpStream` call (code UNAVAILABLE).
message HttpFailure {
  // The error message, then the messages of its sources.
  repeated string causes = 1;
  bool connect = 2;
  bool builder = 3;
  bool timeout = 4;
  optional uint32 status = 5;
  // The response body could not be decoded (e.g. compression).
  bool decode = 6;
}

message Context {
  string data_dir = 1;
  string host_version = 2;
}

message LogRequest {
  string level = 1;
  string message = 2;
}
